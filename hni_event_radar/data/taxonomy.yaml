# Signal taxonomy for the HNI relevance model.
#
# Everything the scorer knows lives here, so the model can be retuned without
# touching code. Weights are additive points against a 100-point cap.
#
# The central distinction: PROSPECT signals mean the room contains people who
# could become clients. PEER signals mean the room contains rival wealth
# managers. A wealth-management summit scores high on peer and low on prospect
# - still worth attending, but for partnerships and intel, not for AUM.

prospect:
  # Direct wealth-segment language. If a listing says "family office", the
  # organiser has already done the qualifying for you.
  wealth_segment:
    weight: 15
    terms:
      - family office
      - uhni
      - ultra high net worth
      - ultra-high-net-worth
      - hni
      - high net worth
      - private wealth
      - private banking
      - private client
      - succession planning
      - estate planning
      - wealth transfer
      - next gen
      - next-gen
      - legacy planning
      - trust structure

  # Liquidity events. Founders exiting or raising become clients within months.
  liquidity:
    weight: 12
    terms:
      - angel investor
      - angel investing
      - venture capital
      - private equity
      - limited partner
      - family capital
      - startup funding
      - fundraising
      - series a
      - series b
      - cap table
      - exit strategy
      - acquisition
      - merger
      - ipo
      - listing gains
      - esop
      - secondary sale
      - buyback
      - founder
      - promoter
      - unicorn

  # Capital-export crowd: already thinking cross-border, already complex.
  capital_export:
    weight: 11
    terms:
      - nri
      - offshore
      - gift city
      - overseas property
      - international property
      - dubai property
      - london property
      - residency by investment
      - citizenship by investment
      - golden visa
      - global investor
      - cross-border
      - lrs

  # Lifestyle spend is the cheapest available proxy for disposable wealth.
  lifestyle:
    weight: 9
    terms:
      - luxury
      - ultra-luxury
      - premium villa
      - penthouse
      - art auction
      - fine art
      - art fair
      - collectible
      - luxury watch
      - fine jewellery
      - jewellery exhibition
      - yacht
      - private jet
      - golf
      - polo
      - wine tasting
      - whisky
      - single malt
      - supercar
      - luxury real estate
      - second home
      - farmhouse
      - vineyard

  # Industry verticals: the largest and most under-served pool of HNI wealth.
  #
  # A machine-tool expo, a pharma conclave or an MSME summit is a room full of
  # factory owners, exporters and second-generation promoters - people with
  # substantial illiquid wealth, concentrated in one business, and typically no
  # existing private-banking relationship. They are far better prospects than a
  # finance-industry conference, where everyone in the room is a competitor.
  #
  # Note the inversion at trade fairs: the promoters are the EXHIBITORS, not
  # the visitors. The scorer flags this so the recommended play says to work
  # the exhibitor list rather than to buy a stall.
  industry_owners:
    weight: 11
    terms:
      - manufacturer
      - manufacturing
      - industrialist
      - industrial
      - factory owner
      - plant head
      - machine tool
      - tooling
      - engineering expo
      - automation expo
      - industry 4.0
      - msme
      - sme
      - small and medium enterprise
      - exporter
      - export promotion
      - import export
      - trade fair
      - trade show
      - b2b expo
      - b2b conclave
      - b2b networking
      - business expo
      - international exhibition
      - exhibitor
      - chamber of commerce
      - industry association
      - confederation of indian industry
      - cii
      - ficci
      - assocham
      - fkcci
      - captains of industry
      - pharma
      - textile
      - auto component
      - automotive
      - electronics manufacturing
      - packaging
      - logistics
      - food processing
      - plastics
      - foundry
      - metal forming
      - construction equipment
      - agritech
      - defence manufacturing
      - aerospace

  # Technology verticals. Bengaluru's newest wealth is here: founders and early
  # employees of companies that have raised, exited or bought back ESOPs.
  tech_industry:
    weight: 8
    terms:
      - ai summit
      - artificial intelligence summit
      - deeptech
      - deep tech
      - saas
      - semiconductor
      - biotech
      - technology summit
      - tech summit
      - innovation summit
      - product summit
      - digital transformation
      - cybersecurity summit
      - data summit
      - global capability center

  # Senior corporate wealth: RSU/ESOP-rich salaried HNIs, distinct from promoters.
  senior_corporate:
    weight: 8
    terms:
      - cxo
      - c-suite
      - ceo summit
      - cfo summit
      - board of directors
      - chairman
      - managing director
      - leadership summit
      - gcc leaders
      - global capability centre
      # Singular forms only - the matcher already tolerates a plural suffix.
      - business owner
      - entrepreneur
      - entrepreneur summit
      - industry leader

  # Investment-product rooms: self-selected investors, though sometimes retail.
  products:
    weight: 7
    terms:
      - pms
      - portfolio management service
      - aif
      - alternative investment
      - private credit
      - structured product
      - reit
      - invit
      - bond investment
      - wealth creation
      - asset allocation
      - investment summit
      - investor summit
      - capital markets

  # Physical-asset buyers: cash-rich, diversification-ready.
  real_assets:
    weight: 6
    terms:
      - plot expo
      - property expo
      - real estate expo
      - real estate summit
      - land investment
      - plotted development
      - property show
      - realty
      - infrastructure investment

# Rooms full of other advisers. Not disqualifying - repriced as a different play.
#
# Professional bodies of the finance industry belong here by definition: a CFA
# Society or AMFI event is the industry talking to itself. Useful for hiring,
# product partnerships and referral flow - not for finding clients.
peer:
  weight: 12
  terms:
    - cfa society
    - cfa institute
    - cfa charter
    - amfi
    - association of mutual funds
    - wealth management summit
    - wealth managers
    - private banker
    - relationship manager
    - financial advisor
    - financial planner
    - investment advisor
    - registered investment adviser
    - ria
    - ifa
    - mutual fund distributor
    - mfd
    - amc
    - asset management company
    - cfp
    - certified financial planner
    - fintech for advisors
    - distributor meet

# Signals that a wealth manager can actually get in and work the room.
access:
  delegate_pass:
    weight: 22
    terms:
      - delegate pass
      - delegate registration
      - registration
      - paid registration
      - register now
      - registration fee
      - buy tickets
      - book now
      - book your seat
      - early bird
      - tickets
      - ticketed
      - passes
      - rsvp
  # Membership is the highest-quality access there is: it buys repeated
  # exposure to the same wealthy cohort instead of a single day among them.
  membership:
    weight: 14
    terms:
      - membership
      - charter member
      - member events
      - join as a member
      - annual member
      - chapter member
  commercial:
    weight: 18
    terms:
      - sponsorship
      - sponsor
      - exhibitor
      - exhibit
      - booth
      - stall
      - partner with us
      - speaking slot
      - become a speaker
  networking:
    weight: 16
    terms:
      - networking
      - 1:1 meetings
      - one-on-one meetings
      - curated meetings
      - roundtable
      - closed door
      - fireside chat
      - cocktail
      - gala dinner
      - meet investors
  # Negative access: the room exists but you cannot buy your way in.
  closed:
    weight: -20
    terms:
      - invite only
      - invitation only
      - by invitation
      - members only
      - strictly private
      - closed group

